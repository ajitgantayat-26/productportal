apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-portal
  labels:
    app: product-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-portal
  template:
    metadata:
      labels:
        app: product-portal
    spec:
      containers:
        - name: product-portal
          image: ajitgantayat26/product-portal:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
